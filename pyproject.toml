[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "legal-rag-verifier"
version = "0.1.0.dev0"
description = "Sentence-level claim and NLI verification with KV-cache rollback during generation, for legal RAG"
readme = "README.md"
authors = [{ name = "Abdullah Memon", email = "abdullah@memonsystems.com" }]
maintainers = [{ name = "Memon Systems Ltd", email = "abdullah@memonsystems.com" }]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
keywords = ["legal", "rag", "verification", "nli", "hallucination", "kv-cache"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]

[project.optional-dependencies]
nli = ["torch>=2.4", "transformers>=4.56"]
hf = ["torch>=2.4", "transformers>=4.56", "accelerate>=1.0", "bitsandbytes>=0.46.1; platform_system != 'Windows'"]
sglang = ["transformers>=4.56"]  # client side; the server runs sglang itself

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "pytest-cov>=5.0",
    "mypy>=1.13",
    "ruff>=0.8",
]

[tool.uv]
default-groups = ["dev"]

# ---------------------------------------------------------------- build
[tool.hatch.build.targets.wheel]
packages = ["src/legal_rag_verifier"]

[tool.hatch.build.targets.sdist]
include = [
    "src/legal_rag_verifier",
    "tests",
    "scripts",
    "docs",
    "README.md",
    "LICENSE",
    "NOTICE",
    "data/MANIFEST.json",
    "pyproject.toml",
]

# ---------------------------------------------------------------- lint / format
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "."]
extend-exclude = ["uk_scrap_data", "data"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "PL", "PT", "N",
    "S", "BLE", "A", "T20", "ISC", "PIE", "RET", "PTH", "TRY", "PERF", "FBT",
]
ignore = [
    "PLR0913",  # verifier/engine entry points legitimately take many parameters
    "TRY003",   # contextual messages on raised exceptions are wanted
    "ISC001",   # conflicts with the formatter
    "RUF001",   # legislation text uses typographic quotes, dashes and no-break spaces; patterns match them
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "FBT", "S311"]
"scripts/**" = ["T20"]
"batteries/**" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["legal_rag_verifier"]

# ---------------------------------------------------------------- types
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
mypy_path = "src"
files = ["src", "tests", "scripts", "batteries"]
exclude = ["^uk_scrap_data/", "^data/", "^batteries/router/", "^scripts/modal_m4\\.py$"]  # modal_m4 runs under `uv run --with modal`

[[tool.mypy.overrides]]
module = ["torch", "torch.*", "transformers", "transformers.*", "sglang", "sglang.*", "modal", "huggingface_hub", "legal_rag_router"]
ignore_missing_imports = true

# ---------------------------------------------------------------- tests
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = [
    "error",
    # transformers' DeBERTa-v2 modelling code still calls torch.jit.script (third-party, harmless)
    "ignore:`torch.jit.script` is deprecated:FutureWarning",
]
markers = [
    "full_data: needs the local corpus under data/ (skipped in CI)",
    "torch: needs the [nli] or [hf] extra",
    "model: needs cached model weights (skipped when absent)",
]

[tool.coverage.run]
source = ["legal_rag_verifier"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
